<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Validation</title>
    <style>
        .error { color: red; font-size: 0.9em; }
        .success { color: green; font-size: 1em; }
        input, textarea { display: block; margin-bottom: 10px; width: 300px; padding: 5px; }
    </style>
</head>
<body>

<h2>Contact Us</h2>
<form id="contactForm">
    <label>Name:</label>
    <input type="text" id="name" name="name">
    <span class="error" id="nameError"></span>

    <label>Subject:</label>
    <input type="text" id="subject" name="subject">
    <span class="error" id="subjectError"></span>

    <label>Email:</label>
    <input type="email" id="email" name="email">
    <span class="error" id="emailError"></span>

    <label>Message:</label>
    <textarea id="message" name="message" rows="4"></textarea>
    <span class="error" id="messageError"></span>

    <label>File (optional):</label>
    <input type="file" id="file" name="file">

    <button type="submit">Submit</button>
    <span class="success" id="successMsg"></span>
</form>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e) {
    e.preventDefault();

    // Clear previous errors
    document.getElementById('nameError').textContent = '';
    document.getElementById('subjectError').textContent = '';
    document.getElementById('emailError').textContent = '';
    document.getElementById('messageError').textContent = '';
    document.getElementById('successMsg').textContent = '';

    // Get form values
    let name = document.getElementById('name').value.trim();
    let subject = document.getElementById('subject').value.trim();
    let email = document.getElementById('email').value.trim();
    let message = document.getElementById('message').value.trim();
    let file = document.getElementById('file').files[0];

    let isValid = true;

    // Name validation
    if (name.length < 2) {
        document.getElementById('nameError').textContent = 'Name must be at least 2 characters.';
        isValid = false;
    }

    // Subject validation
    if (subject.length < 2) {
        document.getElementById('subjectError').textContent = 'Subject must be at least 2 characters.';
        isValid = false;
    }

    // Email validation
    if (!email.includes('@')) {
        document.getElementById('emailError').textContent = 'Email must contain @.';
        isValid = false;
    }

    // Message validation
    if (message.length < 2) {
        document.getElementById('messageError').textContent = 'Message must be at least 2 characters.';
        isValid = false;
    }

    // File is optional, so no validation needed

    if (isValid) {
        document.getElementById('successMsg').textContent = 'Form submitted successfully!';
    }
});
</script>

</body>
</html>
